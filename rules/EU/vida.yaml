# DRAFT rule pack. Not approved. Not legal advice. Disabled until a human compliance approver signs off (Rules.md R-RULES-2, Progress.md D-5).
# Scope: amendments to Directive 2006/112/EC made by Council Directive (EU) 2025/516 of 11 March 2025 ("VAT in the Digital Age", OJ L, 25.3.2025,
# ELI http://data.europa.eu/eli/dir/2025/516/oj). Text read on 2026-10-23 from EUR-Lex CELEX:32025L0516 (as published; no consolidation exists
# for the dates below in the consolidated text dated 2025-04-14).
# Application dates come from Art. 6 of that Directive: Art. 2 -> 2027-01-01; Art. 3 -> 2028-07-01 (Art. 3 point (1) = Art. 28a: each Member
# State applies it at the earliest 2028-07-01 and at the latest 2030-01-01); Art. 4 -> 2029-07-01; Art. 5 -> 2030-07-01 (Member States that
# had a domestic digital real-time transaction-based reporting obligation in place on 2024-01-01, or an Art. 395 authorisation / adopted
# legislation before that date, apply Art. 5 points (5) as regards Art. 218 and (19) by 2035-01-01 for domestic e-invoicing and reporting;
# the Commission may propose postponement after the Art. 271c report).
# The per-Member-State application date is NOT recorded here: it is national data to be added per country pack once verified.
# Entries are deliberately not given `valid_to` on the replaced provisions: the replaced text stays in its original pack until a human
# releases a new version (R-RULES-4, R-RULES-5).
