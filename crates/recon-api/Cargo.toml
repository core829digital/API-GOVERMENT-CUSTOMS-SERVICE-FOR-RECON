[package]
name = "recon-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "recon_api"
path = "src/lib.rs"

[[bin]]
name = "recon-api"
path = "src/bin/recon-api.rs"

[[bin]]
name = "recon-admin"
path = "src/bin/recon-admin.rs"

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
recon-evidence = { path = "../recon-evidence" }
recon-store = { path = "../recon-store" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
recon-engine = { path = "../recon-engine" }
uuid = { version = "1.29.0", features = ["serde", "v7"] }
