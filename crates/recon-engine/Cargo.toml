[package]
name = "recon-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "recon-engine"
path = "src/bin/recon-engine.rs"

[[bin]]
name = "recon-dev-seed"
path = "src/bin/recon-dev-seed.rs"

[dependencies]
recon-store = { path = "../recon-store" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "signal"] }
uuid = { version = "1.29.0", features = ["serde", "v7"] }
sha2 = "0.11.1"

[dev-dependencies]
uuid = { version = "1.29.0", features = ["v7"] }
