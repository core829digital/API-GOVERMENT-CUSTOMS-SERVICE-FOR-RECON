[package]
name = "recon-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
recon-evidence = { path = "../recon-evidence" }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1.29.0", features = ["serde"] }

[dev-dependencies]
aes-gcm = "0.11.1"
uuid = { version = "1.29.0", features = ["v7"] }
