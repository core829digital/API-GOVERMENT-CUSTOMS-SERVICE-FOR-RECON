{{- /* One ServiceAccount per workload. None of them talks to the Kubernetes API: token automount is disabled. */ -}}
{{- range $component := list "api" "frontend" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "recon.fullname" $ }}-{{ $component }}
  labels:
    {{- include "recon.labels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
---
# The migration Job runs as a Helm hook, i.e. BEFORE the regular resources exist on first install, so its
# ServiceAccount and ConfigMap are hooks too (weight -10: created before the Job at weight 0).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "recon.fullname" . }}-migrate
  labels:
    {{- include "recon.labels" (dict "root" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
automountServiceAccountToken: false
